name: CSV Power Tool CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Install locked development tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.15.22 pip-audit==2.10.1
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: python -m ruff check CSV_Consolidator.py tests/test_engine.py packaging/build.py
      - name: Dependency audit
        run: python -m pip_audit -r requirements.lock

  package:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock pyinstaller==6.22.0
      - name: Build clean unsigned executable
        run: python packaging/build.py
      - name: Verify artifact and manifest
        shell: pwsh
        run: |
          if (-not (Test-Path dist/CSV_Power_Tool.exe)) { throw 'Executable missing' }
          if (-not (Test-Path dist/CSV_Power_Tool.dependencies.json)) { throw 'Dependency manifest missing' }
          if (-not (Test-Path dist/CSV_Power_Tool.cdx.json)) { throw 'CycloneDX SBOM missing' }
          if ((Get-AuthenticodeSignature dist/CSV_Power_Tool.exe).Status -ne 'NotSigned') { throw 'Artifact must remain unsigned' }
          python -c "import hashlib; from pathlib import Path; p=Path('dist/CSV_Power_Tool.exe'); print(hashlib.sha256(p.read_bytes()).hexdigest())"
          dist/CSV_Power_Tool.exe --version
      - name: Packaged CLI regression smoke
        shell: pwsh
        run: |
          $env:CSV_POWER_TOOL_EXE = "${{ github.workspace }}\dist\CSV_Power_Tool.exe"
          python -m unittest discover -s tests -v
      - name: Install and uninstall smoke test
        run: |
          python -m pip install --no-deps .
          csv-power-tool --version
          python -m pip uninstall -y csv-power-tool
