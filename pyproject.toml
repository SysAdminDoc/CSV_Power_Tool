[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-power-tool"
version = "3.2.0"
description = "Professional-grade CSV file combiner and processor with GUI and CLI modes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "customtkinter>=5.2.2",
    "tkinterdnd2>=0.4.3",
    "chardet>=5.2.0",
    "openpyxl>=3.1.5",
    "pyarrow>=16.1.0",
    "polars>=1.0.0",
    "rapidfuzz>=3.9.6",
    "duckdb>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pyinstaller>=6.9.0",
]

[project.scripts]
csv-power-tool = "CSV_Consolidator:cli_main"

[tool.setuptools]
py-modules = ["CSV_Consolidator"]
