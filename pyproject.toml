[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-power-tool"
version = "3.2.0"
description = "Professional-grade CSV file combiner and processor with GUI and CLI modes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "customtkinter==5.2.2",
    "tkinterdnd2==0.4.3",
    "darkdetect==0.8.0",
    "packaging==26.2",
    "chardet==5.2.0",
    "openpyxl==3.1.5",
    "et-xmlfile==2.0.0",
    "pyarrow==25.0.0",
    "polars==1.43.2",
    "polars-runtime-32==1.43.2",
    "rapidfuzz==3.14.3",
    "duckdb==1.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pyinstaller==6.20.0",
    "ruff==0.15.22",
]

[project.scripts]
csv-power-tool = "CSV_Consolidator:cli_main"

[tool.setuptools]
py-modules = ["CSV_Consolidator"]
